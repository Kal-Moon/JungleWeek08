name: 오류 · 테스트 실패
description: 재현 가능한 오류와 기대 결과를 기록합니다.
body:
  - type: input
    id: revision
    attributes:
      label: 브랜치와 커밋
      placeholder: "feature/계정/주제, 커밋 SHA"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 명령과 환경
      description: 컨테이너 실행 여부, 테스트 이름, 재현 순서를 적어주세요.
      placeholder: "./scripts/threads-test.sh priority-preempt"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과와 로그
      description: 관련 output/result 내용을 붙이고, 수정 전에도 실패했는지 확인한 범위를 적어주세요.
    validations:
      required: true
  - type: textarea
    id: investigation
    attributes:
      label: 확인한 내용과 관련 이슈
      description: 관찰한 사실과 추측을 구분해 적어주세요.
